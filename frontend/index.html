<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jacob 0.1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-card">
        <div class="orb" aria-hidden="true"></div>
        <p class="eyebrow">Jacob 0.1</p>
        <h1>Bom dia, Jason.</h1>
        <p class="subtitle">Um parceiro digital para clareza, memória e presença diária.</p>
      </section>

      <section class="chat-card">
        <div id="messages" class="messages" aria-live="polite">
          <article class="message jacob">
            <strong>Jacob</strong>
            <p>Estou aqui. Escreva uma mensagem para iniciarmos.</p>
          </article>
        </div>

        <form id="chat-form" class="chat-form">
          <input
            id="message-input"
            type="text"
            placeholder="Ex.: Bom dia, Jacob."
            autocomplete="off"
            required
          />
          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
